name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issue? Don't file it here — use **Security → Report a vulnerability** (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, requests and responses. Redact tokens (`dev_…`, `?s=`).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.0.0 or a commit SHA
  - type: dropdown
    id: setup
    attributes:
      label: Instance setup
      multiple: true
      options: [Deploy button, wrangler from a clone, Cloudflare Access on, Turnstile on, ENROLL_TOKEN set, custom domain]
